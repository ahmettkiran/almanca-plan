.app{
  --ink:#22303F; --ink2:#5C6B7A; --line:#D9DEE4; --bg:#F2F4F6; --card:#FFFFFF; --card2:#FBFCFD;
  --mark:#FFD449; --markInk:#5C4A00; --de:#2F4D7A; --de2:#4A6FA5; --barbg:#E4E8ED;
  --catVideo:#4A6FA5; --catVideoBg:#E3EBF5; --catGram:#A54A4A; --catGramBg:#F5E3E3;
  --catKelime:#9A7B1E; --catKelimeBg:#F5EDD3; --catDin:#3E8A6E; --catDinBg:#DFF0E9;
  --catOku:#7A5EA5; --catOkuBg:#EBE3F5; --catYaz:#A5713E; --catYazBg:#F5EAE0;
  --catKon:#B04A7E; --catKonBg:#F5E3EC; --catTek:#5C6470; --catTekBg:#E7E9ED;
  --ok:#3E8A6E; --bad:#A54A4A; --glow:none;
}
.app[data-theme="dark"]{
  --ink:#E8EBF0; --ink2:#9AA5B1; --line:#2E353F; --bg:#15181D; --card:#1E232B; --card2:#232932;
  --mark:#E5BE3D; --markInk:#1A1503; --de:#8FB0E0; --de2:#6E93C9; --barbg:#2A3038;
  --catVideo:#8FB0E0; --catVideoBg:#232E3E; --catGram:#E09090; --catGramBg:#3A2626;
  --catKelime:#DDBE55; --catKelimeBg:#38301A; --catDin:#7CC9A8; --catDinBg:#1E332B;
  --catOku:#B49AE0; --catOkuBg:#2E2740; --catYaz:#DDA470; --catYazBg:#382C1F;
  --catKon:#E08FB4; --catKonBg:#3A2430; --catTek:#A8B0BC; --catTekBg:#2A2F37;
  --ok:#7CC9A8; --bad:#E09090; --glow:none;
}
.app[data-theme="midnight"]{
  --ink:#DCE3F8; --ink2:#8A96C4; --line:#232C55; --bg:#070B1E; --card:#0F1633; --card2:#131B3D;
  --mark:#F2C55C; --markInk:#241A00; --de:#93A8FF; --de2:#6C84E8; --barbg:#1A2247;
  --catVideo:#93A8FF; --catVideoBg:#1B2450; --catGram:#FF9D9D; --catGramBg:#3D1F2C;
  --catKelime:#F2C55C; --catKelimeBg:#38301A; --catDin:#7FE0BC; --catDinBg:#12352F;
  --catOku:#C3A8FF; --catOkuBg:#2A2355; --catYaz:#F0B080; --catYazBg:#3A2A1C;
  --catKon:#FF9DCB; --catKonBg:#3B1F33; --catTek:#9FAAD6; --catTekBg:#1C2447;
  --ok:#7FE0BC; --bad:#FF9D9D;
  --glow:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(108,132,232,.22), transparent 65%);
}
.app[data-theme="rose"]{
  --ink:#4A2E38; --ink2:#9A6E7D; --line:#EDD2DA; --bg:#F8ECEF; --card:#FFFFFF; --card2:#FDF6F8;
  --mark:#F2B3C5; --markInk:#571F31; --de:#B8556F; --de2:#D0879C; --barbg:#F0DBE1;
  --catVideo:#A06A9E; --catVideoBg:#F3E6F2; --catGram:#C25B5B; --catGramBg:#F9E4E4;
  --catKelime:#B08A2E; --catKelimeBg:#F7EED8; --catDin:#4E9A7E; --catDinBg:#E2F2EB;
  --catOku:#8A6BB5; --catOkuBg:#EEE7F7; --catYaz:#C07E4E; --catYazBg:#F8EBE0;
  --catKon:#C25587; --catKonBg:#F9E4EE; --catTek:#7A6870; --catTekBg:#EFE7EA;
  --ok:#4E9A7E; --bad:#C25B5B;
  --glow:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(242,179,197,.35), transparent 65%);
}
*{box-sizing:border-box; margin:0}
.app{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); background-image:var(--glow); background-repeat:no-repeat; color:var(--ink); min-height:100vh; padding:20px 16px 60px; max-width:1120px; margin:0 auto; transition:background .25s,color .25s}
header{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.eyebrow{font:600 11px/1 ui-monospace,monospace; letter-spacing:.18em; color:var(--ink2); margin-bottom:6px}
h1{font-size:clamp(20px,4vw,28px); font-weight:800; letter-spacing:-.02em}
h1::after{content:""; display:block; width:64px; height:8px; background:var(--mark); margin-top:4px; border-radius:2px}
.hdr-right{display:flex; align-items:center; gap:10px}
.themes{display:flex; gap:3px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:3px}
.th{border:none; background:none; color:var(--ink2); font-size:14px; padding:3px 8px; border-radius:6px}
.th.on{background:var(--mark); color:var(--markInk)}
.save{font:500 12px ui-monospace,monospace; color:var(--ink2)}
.save.ok{color:var(--ok)}
button{cursor:pointer; font:inherit; color:inherit}
.ghost{background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; color:var(--ink2); font-size:12px}
nav{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap}
.tab{border:1px solid var(--line); background:var(--card); border-radius:10px 10px 0 0; padding:8px 14px; font-weight:600; font-size:13.5px; color:var(--ink2); border-bottom:3px solid transparent; display:flex; gap:8px; align-items:center}
.tab em{font:600 11px ui-monospace,monospace; color:var(--ink2)}
.tab em.due{background:var(--mark); color:var(--markInk); padding:1px 6px; border-radius:8px}
.tab.on{color:var(--de); border-bottom-color:var(--mark)}
.bar{height:8px; background:var(--barbg); border-radius:4px; overflow:hidden}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--de2),var(--de)); border-radius:4px; transition:width .3s}
.bar.big{flex:1}
.lvl-head{display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:13px; color:var(--ink2)}
.week{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden}
.week.ctrl{border:2px solid var(--mark)}
.week-head{width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; background:none; border:none; text-align:left}
.wt{font-weight:700; font-size:14px; flex:1}
.wm{font:500 12px ui-monospace,monospace; color:var(--ink2)}
.chev{color:var(--ink2)}
.days{padding:0 12px 12px; display:grid; gap:10px}
@media (min-width:900px){ .days{grid-template-columns:1fr 1fr} .days .add-day{grid-column:1/-1} }
.day{border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card2)}
.day-head{display:flex; justify-content:space-between; font-weight:600; font-size:13px; margin-bottom:8px}
.day-min{font:600 12px ui-monospace,monospace; background:var(--mark); padding:1px 7px; border-radius:6px; color:var(--markInk)}
.task{display:flex; align-items:center; gap:8px; padding:6px 6px; border-radius:8px; background:var(--card); border:1px solid var(--line); margin-bottom:6px; font-size:13.5px}
.task.ghosted{opacity:.35}
.task.done .txt{text-decoration:line-through; color:var(--ink2)}
.grip{cursor:grab; color:var(--ink2); opacity:.6; font-size:13px; user-select:none}
.chip{font:700 10px/1 ui-monospace,monospace; padding:4px 7px; border-radius:6px; white-space:nowrap}
.txt{flex:1; cursor:text}
.edit{flex:1; font:inherit; border:1px solid var(--de); border-radius:6px; padding:3px 6px; background:var(--card); color:var(--ink)}
.min{font:500 11px ui-monospace,monospace; color:var(--ink2); white-space:nowrap}
.pen{background:none; border:none; color:var(--ink2); opacity:.6; font-size:13px; padding:0 2px}
.pen.has{opacity:1; color:var(--de)}
.del{background:none; border:none; color:var(--ink2); opacity:.6; font-size:16px; padding:0 4px}
.del:hover{color:var(--bad); opacity:1}
.note{width:100%; font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--card); color:var(--ink); margin:-2px 0 8px; resize:vertical}
.add-task,.add-day,.add-week{background:none; border:1px dashed var(--line); border-radius:8px; padding:7px; width:100%; color:var(--ink2); font-size:12.5px}
.add-task:hover,.add-day:hover,.add-week:hover{border-color:var(--de); color:var(--de)}
.add-week{margin-top:6px; padding:11px}
.add-form{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.add-form select,.add-form input{font:inherit; font-size:13px; border:1px solid var(--line); border-radius:7px; padding:6px 8px; background:var(--card); color:var(--ink)}
.add-form input[placeholder]{flex:1; min-width:140px}
.add-form button{border:none; background:var(--de); color:var(--bg); border-radius:7px; padding:6px 12px; font-size:13px}
.add-form button.ghost{background:none; color:var(--ink2); border:1px solid var(--line)}
.road{display:grid; gap:12px}
.road-intro{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; font-size:14px; line-height:1.55}
.road-card{display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:left}
.road-card:hover{border-color:var(--de)}
.road-lvl{font:800 22px ui-monospace,monospace; color:var(--markInk); background:var(--mark); border-radius:10px; padding:12px 10px}
.road-body{flex:1; display:grid; gap:6px}
.road-top{display:flex; justify-content:space-between; font-size:14px}
.road-top span{color:var(--ink2); font-size:12.5px}
.road-k{font-size:12.5px; color:var(--ink2)}
.road-pct{font:500 11px ui-monospace,monospace; color:var(--ink2)}
.road-note{font-size:12.5px; color:var(--ink2); text-align:center; padding:4px}
.clist{background:var(--card); border:2px solid var(--mark); border-radius:12px; padding:16px; margin-top:14px}
.clist h3{font-size:15px; margin-bottom:10px; display:flex; justify-content:space-between}
.clist h3 em{font:600 12px ui-monospace,monospace; color:var(--ink2)}
.clist label{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; padding:6px 4px; border-radius:7px; cursor:pointer; line-height:1.4}
.clist label.on{color:var(--ink2); text-decoration:line-through}
.clist label:hover{background:var(--bg)}
.pass{margin-top:10px; font-size:13px; font-weight:600; color:var(--ok)}
.fail{margin-top:10px; font-size:13px; color:var(--ink2)}
/* bug\xFCn */
.today{display:grid; gap:14px}
.today-strip{display:flex; gap:10px; flex-wrap:wrap}
.ts-item{flex:1; min-width:140px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; text-align:left}
.ts-item.link:hover{border-color:var(--de)}
.ts-big{font-weight:800; font-size:16px}
.ts-sub{font-size:11.5px; color:var(--ink2)}
.today-where{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink2); font-weight:600}
.badge{background:var(--mark); color:var(--markInk); font:800 12px ui-monospace,monospace; padding:3px 8px; border-radius:7px}
.today-hint{font-size:12px; color:var(--ink2); text-align:center}
.daily{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--mark); border-radius:12px; padding:14px 16px; display:grid; gap:5px; justify-items:start}
.daily-eyebrow{font:700 10.5px ui-monospace,monospace; letter-spacing:.16em; color:var(--ink2)}
.daily-main{font-size:19px; font-weight:800; letter-spacing:-.01em; line-height:1.3}
.daily-sub{font-size:13.5px; color:var(--ink2)}
.daily-pron,.v-pron{font-style:italic; color:var(--ink2); font-weight:500; font-size:.92em}
.daily-hint{font-size:11.5px; color:var(--ink2); font-style:italic}
.daily-add{border:1px solid var(--de); background:none; color:var(--de); border-radius:8px; padding:4px 12px; font-size:12.5px; margin-top:3px}
.daily-add.in{border-color:var(--ok); color:var(--ok); cursor:default}
.today-done{background:var(--card); border:2px solid var(--ok); border-radius:12px; padding:30px; text-align:center; font-size:16px; font-weight:700}
/* kelime */
.vocab{display:grid; gap:10px}
.v-add{display:flex; gap:8px; flex-wrap:wrap}
.v-lvl-sel{font:inherit; font-size:14px; font-weight:700; border:1px solid var(--line); border-radius:9px; padding:9px 8px; background:var(--card); color:var(--de)}
.v-badge{font:800 10px ui-monospace,monospace; background:var(--barbg); color:var(--ink2); padding:3px 6px; border-radius:6px; flex-shrink:0}
.v-badge.lg{background:var(--mark); color:var(--markInk); font-size:11px; padding:3px 8px}
.v-group-head{width:100%; display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 13px; text-align:left; font-size:14px; font-weight:700; color:var(--ink); margin-bottom:6px; margin-top:8px}
.v-group-head:hover{border-color:var(--de)}
.v-group-head em{font:600 11px ui-monospace,monospace; color:var(--ink2)}
.v-group-head .chev{margin-left:auto; color:var(--ink2)}
/* \xE7izgi filmler */
.shows{display:grid; gap:10px}
.show{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.show-head{width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; background:none; border:none; text-align:left; color:var(--ink)}
.show-title{font-weight:700; font-size:14.5px; flex:1}
.show-prog{font:600 11.5px ui-monospace,monospace; color:var(--markInk); background:var(--mark); padding:2px 8px; border-radius:7px}
.show-body{padding:0 14px 14px; display:grid; gap:8px}
.show-row2{display:flex; align-items:center; gap:10px}
.show-row2 select,.ep-panel input{font:inherit; font-size:13.5px; border:1px solid var(--line); border-radius:8px; padding:7px 9px; background:var(--card2); color:var(--ink)}
.show-label{font:600 11px ui-monospace,monospace; letter-spacing:.06em; color:var(--ink2); text-transform:uppercase}
.pill-row{display:flex; flex-wrap:wrap; gap:6px}
.pill{border:1px solid var(--line); background:var(--card2); color:var(--ink2); border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:700}
.pill:hover{border-color:var(--de); color:var(--de)}
.pill.on{background:var(--de); border-color:var(--de); color:var(--bg)}
.pill.ep{min-width:36px}
.pill.ep.has:not(.on){border-color:var(--ok); color:var(--ok)}
.ep-panel{border:1px solid var(--line); border-left:4px solid var(--mark); border-radius:10px; padding:12px; display:grid; gap:7px; background:var(--card2)}
.ep-title{font-weight:800; font-size:13.5px}
.ep-panel textarea{width:100%; font:inherit; font-size:13.5px; line-height:1.5; border:1px solid var(--line); border-radius:9px; padding:9px 11px; background:var(--card); color:var(--ink); resize:vertical}
.exp-row{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.exp-btn{border:1px solid var(--de); background:none; color:var(--de); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600}
.exp-btn:hover{background:var(--de); color:var(--bg)}
.exp-msg{font-size:12.5px; font-weight:600; color:var(--ok)}
/* onay penceresi */
.confirm{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.4); animation:celebFade .18s ease}
.confirm-card{background:var(--card); border:2px solid var(--bad); border-radius:16px; padding:22px 26px; max-width:400px; width:calc(100% - 40px); display:grid; gap:12px; justify-items:center; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); animation:celebPop .3s cubic-bezier(.2,1.4,.4,1)}
.confirm-emoji{font-size:32px}
.confirm-msg{font-size:14.5px; font-weight:600; line-height:1.5}
.confirm-btns{display:flex; gap:10px}
.confirm-no{border:1px solid var(--line); background:none; color:var(--ink); border-radius:9px; padding:8px 18px; font-size:13.5px; font-weight:600}
.confirm-no:hover{border-color:var(--ink2)}
.confirm-yes{border:none; background:var(--bad); color:var(--bg); border-radius:9px; padding:8px 18px; font-size:13.5px; font-weight:700}
/* \xE7\xF6p kutusu */
.trash{display:grid; gap:8px}
.trash-top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.trash-row{display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 13px}
.trash-icon{font-size:17px; flex-shrink:0}
.trash-texts{flex:1; display:grid; gap:2px; min-width:0}
.trash-label{font-weight:600; font-size:13.5px; overflow-wrap:anywhere}
.trash-sub{font:500 11px ui-monospace,monospace; color:var(--ink2)}
.tr-restore{border:1px solid var(--ok); background:none; color:var(--ok); border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; white-space:nowrap}
.tr-restore:hover{background:var(--ok); color:var(--bg)}
.tr-perma{border:1px solid var(--line); background:none; color:var(--bad); border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; white-space:nowrap}
.tr-perma:hover{border-color:var(--bad)}
@media (max-width:560px){ .trash-row{flex-wrap:wrap} .trash-texts{min-width:100%} }
.sent{display:grid; gap:10px}
.sent-row{align-items:flex-start}
.sent-texts{flex:1; display:grid; gap:2px}
.sent-texts .v-de{font-size:14px}
.show-del{justify-self:end; background:none; border:1px solid var(--line); border-radius:8px; padding:5px 11px; font-size:12px; color:var(--bad)}
.show-del:hover{border-color:var(--bad)}

.v-add input{flex:1; min-width:150px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:9px; padding:9px 11px; background:var(--card); color:var(--ink)}
.v-add button{border:none; background:var(--de); color:var(--bg); border-radius:9px; padding:9px 18px; font-weight:600}
.v-tip{font-size:12px; color:var(--ink2)}
.v-h{font-size:14px; margin-top:8px; display:flex; gap:8px; align-items:center}
.v-h em{font:600 11px ui-monospace,monospace; background:var(--mark); color:var(--markInk); padding:1px 7px; border-radius:8px}
.v-empty{font-size:13px; color:var(--ink2); background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:14px}
.v-card{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px}
.v-de{font-weight:700; font-size:15px; flex:1}
.v-tr{color:var(--ink2); font-size:14px}
.v-show{border:1px solid var(--de); background:none; color:var(--de); border-radius:8px; padding:5px 14px; font-size:13px}
.v-ok{border:none; background:var(--ok); color:var(--bg); border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600}
.v-no{border:none; background:var(--bad); color:var(--bg); border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600}
.v-list{display:grid; gap:5px}
.v-row{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:7px 11px; font-size:13.5px}
.v-tr2{color:var(--ink2); flex:1}
.v-stage{font:500 10.5px ui-monospace,monospace; color:var(--ink2); white-space:nowrap}
/* takvim */
.cal{display:grid; gap:12px}
.cal-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cal-nav{border:1px solid var(--line); background:var(--card); border-radius:8px; padding:4px 12px; font-size:16px; color:var(--ink)}
.cal-month{font-weight:800; font-size:16px; text-transform:capitalize; min-width:140px}
.cal-stats{margin-left:auto; font:600 12.5px ui-monospace,monospace; color:var(--ink2)}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px}
.cal-wd{text-align:center; font:600 11px ui-monospace,monospace; color:var(--ink2); padding:4px 0}
.cal-day{position:relative; aspect-ratio:1; border:1px solid transparent; background:var(--card2); border-radius:9px; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:2px}
.cal-day:hover{border-color:var(--de)}
.cal-day.future{opacity:.35}
.cal-num{font-size:11.5px; line-height:1}
.cal-emo{font-size:14px; line-height:1}
.cal-day.did .cal-num,.cal-day.frz .cal-num{font-weight:700}
.cal-day.did{background:var(--catDinBg)}
.cal-day.frz{background:var(--catVideoBg); color:var(--catVideo)}
.cal-day.today{border:2px solid var(--mark)}
.cal-day.sel{border:2px solid var(--de)}
.cal-detail{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:grid; gap:7px}
.cal-detail-head{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; margin-bottom:4px; text-transform:capitalize}
.cal-min{font:500 11.5px ui-monospace,monospace; color:var(--ink2)}
.cal-entry{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:6px 8px; background:var(--card2); border:1px solid var(--line); border-radius:8px}
/* kutlama */
.celeb{position:fixed; inset:0; z-index:99; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.35); overflow:hidden; cursor:pointer; animation:celebFade .25s ease}
.confetti{position:absolute; top:-40px; animation:confettiFall linear forwards; pointer-events:none}
@keyframes confettiFall{
  0%{transform:translateY(-40px) rotate(0); opacity:1}
  85%{opacity:1}
  100%{transform:translateY(105vh) rotate(var(--rot)); opacity:0}
}
@keyframes celebFade{from{opacity:0}to{opacity:1}}
@keyframes celebPop{0%{transform:scale(.7); opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1); opacity:1}}
.celeb-card{position:relative; background:var(--card); border:2px solid var(--mark); border-radius:18px; padding:22px 46px 22px 24px; display:flex; align-items:center; gap:18px; text-align:left; max-width:560px; width:calc(100% - 40px); animation:celebPop .4s cubic-bezier(.2,1.4,.4,1); box-shadow:0 20px 60px rgba(0,0,0,.35); cursor:default}
.celeb-card.big{border-width:3px}
.celeb-close{position:absolute; top:8px; right:10px; background:none; border:none; font-size:22px; color:var(--ink2); line-height:1; padding:4px}
.celeb-close:hover{color:var(--ink)}
.celeb-emoji{font-size:44px; flex-shrink:0}
.celeb-text{display:grid; gap:5px; min-width:0}
.celeb-title{font-size:19px; font-weight:800; line-height:1.25}
.celeb-card.big .celeb-title{font-size:21px}
.celeb-meaning{font-weight:600; font-size:15px; color:var(--ink2)}
.celeb-sub{font-size:13px; color:var(--ink2); line-height:1.5}
.celeb-added{color:var(--ok); font-weight:600}
.celeb-week{margin-top:4px; font:600 11.5px ui-monospace,monospace; color:var(--markInk); background:var(--mark); padding:4px 10px; border-radius:8px; justify-self:start}
@media (prefers-reduced-motion:reduce){ .confetti{display:none} .celeb-card{animation:none} }
@media (max-width:560px){ .task{flex-wrap:wrap} .txt{min-width:100%} }
